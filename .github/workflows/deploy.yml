name: CI - Bank AI Calling Platform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Audit Main Application
        working-directory: bank-ai-calling
        run: npm audit --audit-level=high

      - name: Audit Bridge Application
        working-directory: bank-ai-calling-bridge
        run: npm audit --audit-level=high


  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            bank-ai-calling/package-lock.json
            bank-ai-calling-bridge/package-lock.json

      - name: Install Main Application Dependencies
        working-directory: bank-ai-calling
        run: npm ci

      - name: Run Main Application Tests
        working-directory: bank-ai-calling
        run: npm test -- --runInBand

      - name: Install Bridge Dependencies
        working-directory: bank-ai-calling-bridge
        run: npm ci

      - name: Build Bridge Application
        working-directory: bank-ai-calling-bridge
        run: npm run build


  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs:
      - security
      - test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Environment Files
        run: |
          touch bank-ai-calling/.env
          touch bank-ai-calling-bridge/.env

      - name: Build Docker Images
        run: docker compose build
